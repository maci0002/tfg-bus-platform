spring:
  application:
    name: bus-platform
  profiles:
    active: dev

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: 8Zz5tw0Ionm3XPZZfN0NOml3z9FMfmpgXwovR9fp6ryDIoGRM8EPHAB6iHsc0fb
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200

# Integración con la API abierta de la Red de Consorcios de Transporte de Andalucía (CTAN).
# El área de Jaén corresponde al consorcio nº 7 (CTJA).
ctan:
  enabled: true
  base-url: http://api.ctan.es/v1
  consorcio-id: 7
  connect-timeout-ms: 5000
  read-timeout-ms: 15000
  average-speed-kmh: 45
  max-lines: 0   # 0 = todas las líneas; valores > 0 limitan la carga (útil en desarrollo)
