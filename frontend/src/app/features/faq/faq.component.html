<div class="faq">
  <div class="faq__header">
    <h1 class="faq__title">{{ 'faq.title' | translate }}</h1>
    <p class="faq__subtitle">{{ 'faq.subtitle' | translate }}</p>
  </div>

  <mat-accordion class="faq__list">
    @for (i of items; track i) {
      <mat-expansion-panel class="faq__panel">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <mat-icon>help_outline</mat-icon>
            {{ 'faq.q' + i | translate }}
          </mat-panel-title>
        </mat-expansion-panel-header>
        <p class="faq__answer">{{ 'faq.a' + i | translate }}</p>
      </mat-expansion-panel>
    }
  </mat-accordion>

  <div class="faq__cta">
    <p>{{ 'faq.stillNeedHelp' | translate }}</p>
    <a mat-raised-button color="primary" routerLink="/contact">
      <mat-icon>mail</mat-icon>
      {{ 'faq.contactUs' | translate }}
    </a>
  </div>
</div>
